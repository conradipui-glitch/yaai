name: Omsk construction Pain Discovery pilot

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "Prior run ID of this Omsk pilot; leave empty for fresh research"
        required: false
        type: string
        default: ""
      confirm_paid_requests:
        description: "Authorize any unfinished paid Wordstat, SERP or Jev requests"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  pain-study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - code: roofing
          - code: screed
          - code: facades
    env:
      YAIS_API: ${{ secrets.YAIS_API }}
      YAIS_ID: ${{ secrets.YAIS_ID }}
      YAIS_FOLDER_ID: ${{ secrets.YAIS_FOLDER_ID }}
      YAIS_AI: ${{ secrets.YAIS_AI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore this case's prior evidence and checkpoints
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          name: omsk-pain-${{ matrix.code }}
          path: pilot/${{ matrix.code }}
      - name: Validate saved stages and finish only missing work
        env:
          CONFIRM_PAID: ${{ inputs.confirm_paid_requests }}
        run: |
          if [ "$CONFIRM_PAID" = "true" ]; then
            node scripts/omsk-pain-resume.mjs \
              --case "${{ matrix.code }}" --dir "pilot/${{ matrix.code }}" --execute
          else
            node scripts/omsk-pain-resume.mjs \
              --case "${{ matrix.code }}" --dir "pilot/${{ matrix.code }}"
          fi
      - name: Summarize observed evidence without pretending hypotheses are verified
        run: |
          node --input-type=module - "pilot/${{ matrix.code }}/pain-map.json" <<'NODE'
          import fs from 'node:fs';
          const map=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(JSON.stringify({
            topic:map.topic,
            generatedAt:map.generatedAt,
            evidenceCount:map.input?.evidenceItemCount,
            accepted:map.summary?.acceptedEvidence,
            requiringReview:map.summary?.uncertainEvidence,
            measuredModelCostUsd:map.summary?.measuredModelCostUsd,
            cards:map.cards?.slice(0,6).map(c=>({
              title:c.title,status:c.status,wordstatPhrases:c.searchPhraseCount,
              serpPages:c.distinctSearchPages
            }))
          },null,2));
          NODE
      - name: Preserve completed evidence and incomplete paid checkpoints for retry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omsk-pain-${{ matrix.code }}
          path: pilot/${{ matrix.code }}/
          if-no-files-found: warn
          retention-days: 7

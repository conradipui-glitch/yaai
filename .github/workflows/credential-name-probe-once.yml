name: One-time Yandex credential name check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/credential-name-probe-once.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      YAIS_API: ${{ secrets.YAIS_API }}
      YAIS_ID: ${{ secrets.YAIS_ID }}
      YAIS_FOLDER_ID: ${{ secrets.YAIS_FOLDER_ID }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
      YANDEX_WEBMASTER_OAUTH_TOKEN: ${{ secrets.YANDEX_WEBMASTER_OAUTH_TOKEN }}
      YANDEX_WEBMASTER_TOKEN: ${{ secrets.YANDEX_WEBMASTER_TOKEN }}
      YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
    steps:
      - name: Print presence only, never secret values
        run: |
          node - <<'NODE'
          const names = ['YAIS_API','YAIS_ID','YAIS_FOLDER_ID','YANDEX_FOLDER_ID','YANDEX_WEBMASTER_OAUTH_TOKEN','YANDEX_WEBMASTER_TOKEN','YANDEX_OAUTH_TOKEN'];
          for (const name of names) console.log(`${name}_configured=${Boolean(process.env[name])}`);
          NODE

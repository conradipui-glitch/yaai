name: TOHARO Wordstat batch

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 1 * *'

permissions:
  contents: write

concurrency:
  group: wordstat-batch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      YAIS_API: ${{ secrets.YAIS_API }}
      YAIS_ID: ${{ secrets.YAIS_ID }}
      YANDEX_FOLDER_ID: b1gfllt28aev9insu589
      CASE_ID: totharo-seo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect Wordstat batch and analyze query actions
        run: node scripts/batch.mjs
      - name: Build Page Planner snapshot
        run: node scripts/build-page-plan.mjs
      - name: Archive dated case snapshot
        run: node scripts/snapshot-results.mjs
      - name: Compare with previous case snapshot
        run: node scripts/compare-snapshots.mjs
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: totharo-wordstat
          path: |
            results/
            research/cases/totharo-seo/
          retention-days: 30
      - name: Commit latest public research snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            results/totharo-wordstat-latest.csv \
            results/totharo-wordstat-latest.json \
            results/totharo-wordstat-summary.md \
            results/totharo-intents-latest.csv \
            results/totharo-intents-latest.json \
            results/totharo-intents-summary.md \
            results/totharo-query-actions-latest.csv \
            results/totharo-page-plan-latest.csv \
            results/totharo-page-plan-latest.json \
            results/totharo-page-plan-summary.md \
            research/cases/totharo-seo
          if git diff --cached --quiet; then
            echo "No result changes to commit"
            exit 0
          fi
          git commit -m "data: refresh TOHARO research case snapshot"
          git push

              title: 'Как Заработать в Телеграме в 2026 | Продвижение Телеграм Канала с Нуля',
              date: '2026-02-27T00:00:00.000Z',
              views: 4, likes: null, comments: null
            },
            {
              q: 'арбитраж трафика заработок 2026',
              videoId: 'FPV_4oWJ6Sg',
              channelId: 'anton-khomenok',
              channel: 'Anton Khomenok',
              title: 'Арбитраж Трафика | Как зарабатывать в интернете в 2026 без вложений и навыков?',
              date: '2026-07-01T00:00:00.000Z',
              views: 1839, likes: 43, comments: null
            }
          ];

          const entities = new Map();
          const contentItems = [];
          const metricsSnapshots = [];

          for (const row of rows) {
            const entity = createEntity({
              platform: 'youtube',
              type: 'channel',
              externalId: row.channelId,
              name: row.channel,
              url: 'https://www.youtube.com/',
            });
            entities.set(entity.id, entity);
            const item = createContentItem({
              platform: 'youtube',
              type: 'video',
              externalId: row.videoId,
              entityId: entity.id,
              url: 'https://www.youtube.com/watch?v=' + row.videoId,
              title: row.title,
              text: '',
              publishedAt: row.date,
              discoveredBy: [{ type: 'query', value: row.q }],
            });
            contentItems.push(item);
            metricsSnapshots.push(createMetricsSnapshot({
              platform: 'youtube',
              contentId: item.id,
              observedAt: generatedAt,
              metrics: {
                views: row.views,

          } from './lib/source-adapter.mjs';

          const generatedAt = '2026-10-05T08:55:00.000Z';
          const rows = [
            {
              q: 'заработок на нейросетях 2026',
              videoId: 'xBZ27BDzD44',
              channelId: 'dmitry-moskalenko-ai-money',
              channel: 'Дмитрий Москаленко | Деньги на нейросетях',
              title: 'Как заработать на нейросетях в 2026: 9 реальных способов',
              date: '2026-08-17T00:00:00.000Z',
              views: 8342, likes: 547, comments: null
            },
            {
              q: 'заработок на нейросетях 2026',
              videoId: 'z1UqcrVCa9k',
              channelId: 'cryptomax',
              channel: 'CryptoMax',
              title: 'Я проверил 4 способа заработка на ИИ — вот что РЕАЛЬНО работает в 2026',

              date: '2026-08-05T00:00:00.000Z',
              views: 49397, likes: null, comments: null
            },
            {
              q: 'удаленная работа фриланс 2026',
              videoId: '2BxJgQ4m75Y',
              channelId: 'pavel-pro-freelance',
              channel: 'Павел Про Фриланс',
              title: 'УДАЛЕННАЯ РАБОТА для тех, кто НИЧЕГО не умеет (2026)',
              date: '2026-05-14T00:00:00.000Z',
              views: 590, likes: 14, comments: null
            },
            {
              q: 'заработок на маркетплейсах 2026',
              videoId: 'fpWL4CjAjg4',
              channelId: 'artem-yuriev-marketplaces',
              channel: 'Артем Юрьев / Тайны Маркетплейсов / OZON & WB',
              title: 'Маркетплейсы в 2026 — ловушка для новичков. Можно ли заработать?',
              date: '2026-01-26T00:00:00.000Z',
              views: 1301, likes: 32, comments: null
            },
            {
              q: 'заработок на Telegram канале 2026',
              videoId: 'UpIW4vyymOE',
              channelId: 'andrey-polevoy',
              channel: 'Андрей Полевой',
              title: 'Делай 3000$ в месяц на TELEGRAM в 2026. Как раскрутить Телеграм канал?',
              date: '2026-01-03T00:00:00.000Z',
              views: 6530, likes: 181, comments: null
            },
            {
              q: 'заработок на Telegram канале 2026',
              videoId: 'Am3tLDrlWak',

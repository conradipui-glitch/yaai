name: Pain Quality relevance-controlled pilot
# Use only pre-existing Yandex evidence; Jev is opt-in and resumable.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Original Pain Quality real-data run containing Yandex SERP evidence"
        required: true
        type: string
        default: "37803334636"
      resume_run_id:
        description: "Earlier relevance pilot run ID to restore Jev checkpoints (optional)"
        required: false
        type: string
        default: ""
      confirm_paid_requests:
        description: "Explicitly authorize missing Jev decisions (up to 90)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  relevance-controlled-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YAIS_AI: ${{ secrets.YAIS_AI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore existing Yandex observations; no Yandex API calls
        uses: actions/download-artifact@v4
        with:
          name: pain-quality-real-pilot-2026-10-08
          path: pilot/raw
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Restore earlier filtered data, assessment and Jev checkpoints
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: pain-quality-relevant-real-sample-2026-10-08
          path: pilot/clean
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Validate sources, apply topic filter and resume approved work
        env:
          CONFIRM_PAID: ${{ inputs.confirm_paid_requests }}
        run: |
          if [ "$CONFIRM_PAID" = "true" ]; then
            node scripts/cached-jev-pilots.mjs --mode relevance \
              --source pilot/raw --dir pilot/clean --execute
          else
            node scripts/cached-jev-pilots.mjs --mode relevance \
              --source pilot/raw --dir pilot/clean
          fi
      - name: Print source population and human-review status
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const prefix='pilot/clean/';
          const map=JSON.parse(fs.readFileSync(prefix+'pain-map.json','utf8'));
          const review=JSON.parse(fs.readFileSync(prefix+'review-unlabeled.json','utf8'));
          if(review.items.some(row=>row.label.isPain!==null)) throw Error('Unexpected human labels.');
          console.log(JSON.stringify({
            topic:map.topic,
            distinctRelevantObservations:map.evidenceLedger.length,
            blindReviewCount:review.items.length,
            jevAccepted:map.summary.acceptedEvidence,
            jevCostUsd:map.summary.measuredModelCostUsd,
            humanLabels:0
          }));
          NODE
      - name: Save filtered evidence, reports and partial Jev checkpoints on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pain-quality-relevant-real-sample-2026-10-08
          path: pilot/clean/
          if-no-files-found: ignore
          retention-days: 7

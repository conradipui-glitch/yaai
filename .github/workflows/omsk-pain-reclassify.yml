name: Reclassify cached Omsk search demand and SERP with Jev
# Uses previously paid Yandex evidence; only missing Jev decisions may cost money.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Original Omsk study run ID containing Wordstat and SERP evidence"
        required: true
        type: string
        default: "37803639247"
      resume_run_id:
        description: "Earlier reclassification run ID to restore checkpoints (optional)"
        required: false
        type: string
        default: ""
      confirm_paid_requests:
        description: "Explicitly allow any missing Jev decisions"
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  reclassify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - code: roofing
          - code: screed
          - code: facades
    env:
      YAIS_AI: ${{ secrets.YAIS_AI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore original Yandex observations; no new Yandex API calls
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          name: omsk-pain-${{ matrix.code }}
          path: ${{ runner.temp }}/input
      - name: Restore prior partial Jev assessment and report
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          name: omsk-reclassified-${{ matrix.code }}
          path: ${{ runner.temp }}/reclassified
      - name: Validate artifacts, skip completed stages and gate new paid decisions
        env:
          CONFIRM_PAID: ${{ inputs.confirm_paid_requests }}
        run: |
          if [ "$CONFIRM_PAID" = "true" ]; then
            node scripts/cached-jev-pilots.mjs --mode omsk --case "${{ matrix.code }}" \
              --source "$RUNNER_TEMP/input" --dir "$RUNNER_TEMP/reclassified" --execute
          else
            node scripts/cached-jev-pilots.mjs --mode omsk --case "${{ matrix.code }}" \
              --source "$RUNNER_TEMP/input" --dir "$RUNNER_TEMP/reclassified"
          fi
      - name: Print measured evidence and uncertainty (read-only)
        run: |
          node --input-type=module - "$RUNNER_TEMP/reclassified/pain-map.json" <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(JSON.stringify({
            topic:d.topic, input:d.input, summary:d.summary,
            classifications:d.evidenceLedger.map(x=>({
              kind:x.kind, query:x.query, observedCount:x.observedCount,
              sourceUrl:x.url, accepted:x.classification?.accepted,
              category:x.classification?.category,
              probability:x.classification?.painProbability,
              needsReview:x.classification?.needsReview
            }))
          },null,2));
          NODE
      - name: Save outputs and partial Jev checkpoints even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omsk-reclassified-${{ matrix.code }}
          path: ${{ runner.temp }}/reclassified/
          if-no-files-found: ignore
          retention-days: 7

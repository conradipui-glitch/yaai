name: SERP smoke

on:
  workflow_dispatch:
    inputs:
      query:
        description: Single Yandex query for a live smoke test
        required: false
        default: "мобильная баня омск"
      region:
        description: Yandex region id
        required: false
        default: "66"
  push:
    paths:
      - '.github/workflows/serp-smoke.yml'
      - 'scripts/serp-collect.mjs'
      - 'scripts/serp-analyze.mjs'
      - 'lib/serp-evidence.mjs'

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      YAIS_API: ${{ secrets.YAIS_API }}
      YAIS_ID: ${{ secrets.YAIS_ID }}
      YAIS_FOLDER_ID: ${{ secrets.YAIS_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve smoke inputs
        id: vars
        shell: bash
        run: |
          QUERY='${{ github.event.inputs.query }}'
          REGION='${{ github.event.inputs.region }}'
          if [ -z "$QUERY" ]; then QUERY='баня под ключ омск,готовые бани омск,купить готовую баню омск,мобильная баня омск,каркасная баня омск,кедровая баня омск,баня с доставкой омск,баня 2х2 омск,баня 3х2 омск,баня 4х2 омск,баня под ключ омск цены,купить баню под ключ омск'; fi
          if [ -z "$REGION" ]; then REGION='66'; fi
          printf 'query=%s\n' "$QUERY" >> "$GITHUB_OUTPUT"
          printf 'region=%s\n' "$REGION" >> "$GITHUB_OUTPUT"
      - name: Collect one live Yandex SERP
        run: |
          mkdir -p .data
          npm run serp:collect -- \
            --queries "${{ steps.vars.outputs.query }}" \
            --region "${{ steps.vars.outputs.region }}" \
            --groups 10 \
            --own-domain conradipui-glitch.github.io \
            --out .data/serp-evidence.json \
            --execute
      - name: Analyze SERP evidence
        run: |
          npm run serp:analyze -- \
            --input .data/serp-evidence.json \
            --out .data/serp-analysis.json \
            --own-domain conradipui-glitch.github.io \
            --top 10
      - name: Print smoke summary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('.data/serp-analysis.json', 'utf8'));
          console.log(JSON.stringify({
            generatedAt: data.meta.generatedAt,
            region: data.meta.region,
            queryCount: data.meta.queryCount,
            ownDomain: data.meta.ownDomain,
            ownPresentQueries: data.own.presentQueries,
            ownAbsentQueries: data.own.absentQueries,
            competitorDomainsObserved: data.competitors.length,
            topObservedDomains: data.competitors.slice(0, 7).map(x => ({
              domain: x.domain,
              queryCount: x.queryCount,
              bestPosition: x.bestPosition,
              top3: x.top3
            })),
            querySummary: data.queries.map(x => ({
              query: x.query,
              ownPresent: x.ownPresent,
              ownPosition: x.ownPosition,
              gapType: x.gapType,
              topDomains: x.topDomains.slice(0, 5).map(y => y.domain)
            }))
          }, null, 2));
          NODE

name: Pain Quality real-data pilot

# Paid collection/evaluation is opt-in; resumptions may run offline.
on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "Earlier run ID of THIS pilot; leave empty for a fresh run"
        required: false
        type: string
        default: ""
      confirm_paid_requests:
        description: "Explicitly allow only missing paid Yandex/Jev stages"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  real-data-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore private prior artifacts only when explicitly requested
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          name: pain-quality-real-pilot-2026-10-08
          path: pilot/
      - name: Validate and resume only unfinished stages
        env:
          YAIS_API: ${{ secrets.YAIS_API }}
          YAIS_ID: ${{ secrets.YAIS_ID }}
          YAIS_FOLDER_ID: ${{ secrets.YAIS_FOLDER_ID }}
          YAIS_AI: ${{ secrets.YAIS_AI }}
          CONFIRM_PAID: ${{ inputs.confirm_paid_requests }}
        run: |
          if [ "$CONFIRM_PAID" = "true" ]; then
            node scripts/pain-pilot-resume.mjs --dir pilot --execute
          else
            node scripts/pain-pilot-resume.mjs --dir pilot
          fi
      - name: Upload all completed stages AND Jev checkpoints on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pain-quality-real-pilot-2026-10-08
          path: pilot/
          if-no-files-found: warn
          retention-days: 7
